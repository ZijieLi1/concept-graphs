# ConceptGraphs in ROS 2 Humble (Python 3.10 + torch + rclpy in one process).
#
# Host: NVIDIA driver + nvidia-container-toolkit
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#
# Display (Rerun / Open3D): xhost +local:docker
#
# Phone USB: Record3D uses host usbmuxd, not just /dev/bus/usb.
# One container; publisher and mapper are separate processes:
#   docker compose run --rm conceptgraph
#   python3 conceptgraph/scripts/record3d_ros_publisher.py
#   python3 slam/r3d_stream_rerun_realtime_mapping.py ingest=ros

services:
  conceptgraph:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: conceptgraph:humble
    hostname: conceptgraph
    working_dir: /ws
    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,display
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # Path (not inode) so a restarted host usbmuxd is still visible.
      USBMUXD_SOCKET_ADDRESS: UNIX:/host-run/usbmuxd
      HF_HOME: /root/.cache/huggingface
    volumes:
      - .:/ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - /dev/bus/usb:/dev/bus/usb
      - /run:/host-run:ro
      - /var/lib/lockdown:/var/lib/lockdown:ro
    entrypoint: ["/ws/docker/entrypoint.sh"]
    device_cgroup_rules:
      - "c 189:* rmw"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
